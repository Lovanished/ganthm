<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Web</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="selectScreen" class="screen"><div class="panel"><h1>RHYTHM WEB</h1><p class="sub">SELECT SONG</p><div id="songList"></div><button id="playSelected" disabled>PLAY</button><p id="loadStatus"></p></div></div>
