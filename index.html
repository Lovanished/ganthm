<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Web</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="selectScreen" class="screen">
  <div class="panel">
    <h1>RHYTHM WEB</h1>
    <p class="sub">SELECT SONG</p>
    <div id="songList"></div>
    <div class="speedControl">
      <label for="speedRange">노트 속도 <span id="speedValue">430</span></label>
      <input type="range" id="speedRange" min="200" max="900" step="10" value="430">
    </div>
    <button id="playSelected" disabled>PLAY</button>
    <p id="loadStatus"></p>
  </div>
</div>
<div id="gameScreen" class="screen hidden">
  <header><button id="backBtn">SONG SELECT</button><strong id="songTitle"></strong><span id="score">SCORE 0</span><span id="combo">COMBO 0</span><span id="judge"></span><span class="editHint">SPACE: 채보 작성 모드</span></header>
  <div id="editHud" class="hidden">
    <div class="editRow"><b>채보 작성 모드</b><span id="editStatus">PAUSED</span></div>
    <div class="editRow"><span>TIME</span><span id="editTime">0:00 / 0:00</span></div>
    <div class="editRow"><span>NOTES</span><span id="editCount">0</span></div>
    <div class="editRow"><label for="snapDivision">스냅</label>
      <select id="snapDivision">
        <option value="1">1/1</option><option value="2">1/2</option><option value="3">1/3</option>
        <option value="4" selected>1/4</option><option value="6">1/6</option><option value="8">1/8</option>
      </select>
    </div>
    <div class="editRow"><button id="editUndoBtn">실행취소 (Z)</button><button id="editSaveBtn">저장 (S)</button></div>
    <div class="editKeys">SPACE 모드전환 · ENTER 재생/일시정지 · ←/→ 1비트 이동 · SHIFT+←/→ 1초 이동 · D F J K 노트 입력 · Z 실행취소 · S 저장</div>
  </div>
  <main>
    <div id="gameWrap">
      <div class="sideDeco" id="decoLeft"><img id="decoLeftImg" alt=""></div>
      <div id="game">
        <div class="laneArea">
          <div id="lanes"></div>
          <div id="hitLine"></div>
          <div id="notes"></div>
        </div>
      </div>
      <div class="sideDeco" id="decoRight"><img id="decoRightImg" alt=""></div>
    </div>
    <div id="keys"><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></div>
  </main>
  <div id="result" class="hidden"></div>
</div>
<script src="game.js"></script></body></html>
