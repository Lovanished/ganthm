<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Web</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="selectScreen" class="screen">
  <div class="selectLayout">
    <div class="selectSlider">
      <div class="slideTrack" id="slideTrack">
        <div class="slidePage" id="pageSettings">
          <div class="pageHeader"><button class="backSlide" data-nav="home">◀ 뒤로</button><p class="sub">SETTINGS</p></div>
          <div class="speedControl">
            <label for="speedRange">노트 속도 <span id="speedValue">430</span></label>
            <input type="range" id="speedRange" min="200" max="900" step="10" value="430">
          </div>
          <div class="keyBindSection">
            <p class="sub small">키 커스터마이징</p>
            <p class="subtle">준비 중인 기능입니다</p>
          </div>
        </div>
        <div class="slidePage" id="pageHome">
          <h1>RHYTHM WEB</h1>
          <button class="bigBtn" data-nav="songs">곡 플레이</button>
          <button class="bigBtn secondary" data-nav="settings">설정</button>
        </div>
        <div class="slidePage" id="pageSongs">
          <div class="pageHeader"><button class="backSlide" data-nav="home">◀ 뒤로</button><p class="sub">SELECT SONG</p></div>
          <div id="songList"></div>
        </div>
        <div class="slidePage" id="pageModes">
          <div class="pageHeader"><button class="backSlide" data-nav="songs">◀ 뒤로</button><p class="sub">SELECT MODE</p></div>
          <div id="modeList"></div>
        </div>
      </div>
    </div>
    <div class="selectSide">
      <div class="sideIdle"><img id="selectIdleImg" class="idleWiggle" alt=""></div>
      <button id="playSelected" disabled>PLAY</button>
      <p id="loadStatus"></p>
    </div>
  </div>
</div>
<div id="gameScreen" class="screen hidden">
  <header><button id="backBtn">SONG SELECT</button><strong id="songTitle"></strong><span id="score">SCORE 0</span><span id="combo">COMBO 0</span><span id="judge"></span><span class="editHint">SPACE: 채보 작성 모드</span></header>
  <div id="editHud" class="hidden">
    <div class="editRow"><b>채보 작성 모드</b><span id="editStatus">PAUSED</span></div>
    <div class="editRow"><span>TIME</span><span id="editTime">0:00 / 0:00</span></div>
    <div class="editRow"><span>NOTES</span><span id="editCount">0</span></div>
    <div class="editRow"><label for="snapDivision">스냅</label>
      <select id="snapDivision">
        <option value="1">1/1</option><option value="2">1/2</option><option value="3">1/3</option>
        <option value="4" selected>1/4</option><option value="6">1/6</option><option value="8">1/8</option>
      </select>
    </div>
    <div class="editRow"><button id="editUndoBtn">실행취소 (⌫)</button><button id="editSaveBtn">저장 (S)</button></div>
    <div class="editKeys">SPACE 모드전환 · ENTER 재생/일시정지 · ←/→ 1비트 이동 · SHIFT+←/→ 1초 이동 · 레인 키 노트 입력 · BACKSPACE 실행취소 · S 저장</div>
  </div>
  <main>
    <div id="gameWrap">
      <div class="sideDeco" id="decoLeft"><img id="decoLeftImg" alt=""></div>
      <div id="game">
        <div class="laneArea">
          <div id="lanes"></div>
          <div id="hitLine"></div>
          <div id="notes"></div>
        </div>
      </div>
      <div class="sideDeco" id="decoRight"><img id="decoRightImg" alt=""></div>
    </div>
    <div id="keys"><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></div>
  </main>
  <div id="result" class="hidden"></div>
</div>
<script src="game.js"></script></body></html>
